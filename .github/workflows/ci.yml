name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for byte-reproducible builds: bun's bundler emits different
          # CJS interop scaffolding across versions, so 'latest' makes it
          # impossible to binary-verify a published artifact against a local
          # build. Keep in sync with RELEASING.md; bump deliberately.
          bun-version: 1.2.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
